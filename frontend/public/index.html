<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Analyzer Chatbot</title>
  <link href="tailwind.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans h-screen flex flex-col">
  <header class="bg-brand text-white p-6 text-center rounded-t-none shadow-md">
    <h1 class="text-2xl font-bold">Resume Analyzer Chatbot</h1>
    <p class="text-sm mt-2">Upload your resume and job description for AI-powered skill matching!</p>
  </header>
  <div id="chat-container" class="flex-1 overflow-hidden">
    <div id="chat-window" class="h-full overflow-y-auto p-6 bg-white shadow-inner">
      <div class="message bot-message animate-fade-in">
        <span class="avatar">🤖</span>
        <span class="message-text">Hello! Please upload your resume.</span>
      </div>
    </div>
    <div id="loading" class="hidden p-4 text-center bg-gray-100">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-brand"></div>
      <span class="ml-2">Processing...</span>
    </div>
  </div>
  <footer class="bg-white p-4 border-t border-gray-200">
    <input type="file" id="resume" accept=".pdf" class="hidden">
    <div class="flex items-center space-x-2">
      <button id="upload-btn" class="bg-brand text-white py-2 px-4 rounded-lg hover:bg-brand-dark transition">
        Upload Resume
      </button>
      <div id="upload-progress" class="h-1 bg-brand-light transition-all duration-1000 w-0 flex-1"></div>
      <input type="text" id="user-input" placeholder="Enter job description..." class="flex-1 p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand">
      <button id="send-btn" class="bg-brand text-white py-2 px-4 rounded-lg hover:bg-brand-dark transition">
        Send
      </button>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
